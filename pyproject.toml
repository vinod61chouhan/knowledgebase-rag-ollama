[project]
name = "knowledgebase-rag"
version = "0.1.0"
description = "Local-first LangChain Ollama PostgreSQL RAG API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12",
  "pydantic-settings>=2.5,<3", "asyncpg>=0.29,<1", "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<2", "langchain-ollama>=0.3,<2",
  "pymupdf>=1.24,<2", "python-docx>=1.1,<2", "pytesseract>=0.3,<1",
  "pillow>=10,<13", "rank-bm25>=0.2.2,<1", "numpy>=1.26,<3",
  "sentence-transformers>=3,<6", "structlog>=24,<27", "httpx>=0.27,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
